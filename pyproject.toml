[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutradhar"
version = "0.1.0"
description = "A continuity editor for fiction: story bible + contradiction finder, powered by the BharatCode model API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sutradhar = "sutradhar.cli:main"

[tool.setuptools.packages.find]
include = ["sutradhar*"]

[tool.setuptools.package-data]
sutradhar = ["web/*.html", "demo_story.md"]
